name: Install uploaded Armored GLB
on:
  push:
    branches: [feat/armored-native-20261015]
    paths: ['.github/workflows/install-armored-native.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download the user-supplied rigged Armored Titan
        run: |
          curl -fLsS --connect-timeout 15 --max-time 90 --retry 2 -o public/models/titans/armored_titan.glb 'https://d2ol7oe51mr4n9.cloudfront.net/user_34QjeOFhUZCLT9wZ4vgB98VZeog/ac9a5c30-b587-47be-9ea9-4200a0fc37ce.glb'
          python3 - <<'PY'
          import os,struct,json
          p='public/models/titans/armored_titan.glb'
          with open(p,'rb') as f:
            h=f.read(20)
            assert h[:4]==b'glTF' and struct.unpack_from('<I',h,4)[0]==2
            n=struct.unpack_from('<I',h,8)[0]
            assert n==os.path.getsize(p)
            chunklength=struct.unpack_from('<I',h,12)[0]
            assert h[16:20]==b'JSON'
            scene=json.loads(f.read(chunklength))
            assert scene.get('skins') and scene.get('animations'), 'Rigged animation missing'
            print('Armored GLB validated',n,'bytes,',len(scene['skins']),'skins,',len(scene['animations']),'animations')
          PY
      - name: Commit binary asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/titans/armored_titan.glb
          git commit -m "Replace Armored Titan with uploaded rigged run GLB"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
