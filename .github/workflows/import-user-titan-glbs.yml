name: Import user-provided colored Titan GLBs
on:
  push:
    branches: [feature/user-glb-rigged-titans]
    paths:
      - 'scripts/import-user-titan-glbs.py'
      - '.github/workflows/import-user-titan-glbs.yml'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'trimesh>=4,<5' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - run: python scripts/import-user-titan-glbs.py
      - name: Commit verified GLB files
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/models/titans/*.glb
          git commit -m "Import six user Meshy GLBs with basic vertex colors" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
