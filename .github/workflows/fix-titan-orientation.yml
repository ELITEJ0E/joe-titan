name: Fix Titan GLB Orientation
on:
  push:
    branches: [fix/colored-titan-orientation-oct15]
    paths: ['.github/workflows/fix-titan-orientation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/titan-glb-models.js")
          s=p.read_text()
          s=s.replace("pivot.name='User GLB skinned / '+kind;", "pivot.name='User GLB skinned / '+kind;\n pivot.rotation.y=Math.PI;")
          s=s.replace("color:0xffffff,vertexColors:!!geo.attributes.color,roughness:.88,", "color:0xffffff,vertexColors:!!geo.attributes.color,roughness:.88,toneMapped:false,")
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/titan-glb-models.js
          git commit -m "Correct Titan GLB facing and material settings" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
