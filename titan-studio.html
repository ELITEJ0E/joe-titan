<!doctype html><html><head><meta charset="utf-8"><title>Titan color studio</title><style>body{margin:0;background:#e3e0d9;font:15px system-ui;color:#302b29}header{padding:14px 22px;background:#faf8f3;display:flex;gap:18px;align-items:center}main{display:grid;grid-template-columns:repeat(4,1fr)}article{position:relative;height:470px;border:1px solid #cbc7bf}canvas{width:100%;height:100%;display:block}h3{position:absolute;top:8px;left:14px;margin:0;font-size:15px}button,select{padding:7px}#status{font-size:12px}</style></head><body><header><b>Titan reference color review</b><select id="angle"><option value="0.45">Three quarter</option><option value="0">Front</option><option value="1.57">Side</option><option value="3.14">Back</option></select><button id="spin">Rotate</button><span id="status">Loading models…</span></header><main></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const names=['armored_idle','beast_titan','colossal_titan','female_titan','founding_titan','jaw_titan','war_hammer_titan','attack_titan','armored_titan'];
const loader=new GLTFLoader(),views=[];let spinning=false,angle=.45;
for(const name of names){
 const box=document.createElement('article');box.innerHTML=`<h3>${name.replaceAll('_',' ')}</h3>`;document.querySelector('main').append(box);
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(box.clientWidth,box.clientHeight);renderer.setClearColor(0xe3e0d9);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;box.append(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,box.clientWidth/box.clientHeight,.01,40);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.52,0);camera.position.set(Math.sin(angle)*2.5,1.05,Math.cos(angle)*2.5);controls.update();
 scene.add(new THREE.HemisphereLight(0xeaf2ff,0x88725c,2));const light=new THREE.DirectionalLight(0xffecd4,3.3);light.position.set(-3,5,4);scene.add(light);const fill=new THREE.DirectionalLight(0xffffff,1.1);fill.position.set(3,2,-4);scene.add(fill);
 const gltf=await loader.loadAsync('/models/titans/'+name+'.glb');const model=gltf.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const scale=1/size.y;const pivot=new THREE.Group();model.scale.multiplyScalar(scale);model.position.sub(new THREE.Vector3(center.x,bounds.min.y,center.z).multiplyScalar(scale));pivot.add(model);scene.add(pivot);model.traverse(o=>{if(o.isMesh&&!o.geometry.attributes.normal)o.geometry.computeVertexNormals();});
 views.push({renderer,scene,camera,controls,pivot,gltf,name});
}
document.querySelector('#status').textContent='9 models loaded • drag to orbit, scroll to zoom';
document.querySelector('#angle').onchange=e=>{angle=Number(e.target.value);for(const v of views){v.pivot.rotation.y=0;v.camera.position.set(Math.sin(angle)*2.5,1.05,Math.cos(angle)*2.5);v.controls.update();}};
document.querySelector('#spin').onclick=()=>spinning=!spinning;
window.titanStudio={views,THREE};function frame(){requestAnimationFrame(frame);for(const v of views){if(spinning)v.pivot.rotation.y+=.006;v.controls.update();v.renderer.render(v.scene,v.camera);}}frame();
</script></body></html>
